<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>谷谷商城 · C 端购物演示（F12 · 单文件版）</title>
<style>
/* 谷谷商城 · C 端购物演示（F12 demo）——纯静态，无依赖；数据为 mock */
:root {
  --brand: #ff4f30;
  --brand-2: #ff7a45;
  --brand-grad: linear-gradient(135deg, #ff6034, #ff4f30);
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #1f2329;
  --sub: #86909c;
  --line: #eef0f3;
  --price: #ff2e63;
  --green: #00b578;
  --blue: #3b7bff;
  --amber: #ff9f0a;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #2a2c33;
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 14px; outline: none; }
.hidden { display: none !important; }

/* —— 手机壳 —— */
#phone {
  width: 100%; max-width: 420px; height: 100dvh;
  background: var(--bg);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
@media (min-width: 520px) {
  #phone { height: min(880px, 100vh - 24px); border-radius: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
}

/* —— 顶栏 —— */
.topbar {
  height: 48px; flex: 0 0 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px; background: var(--card);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 5;
}
.topbar .title { font-size: 16px; font-weight: 600; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text);
}
.icon-btn.placeholder { visibility: hidden; }

/* —— 视图容器 —— */
.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
#view-home, #view-cart, #view-orders, #view-profile { padding-bottom: 76px; } /* 给 tabbar 留位 */

/* —— 底部导航 —— */
#tabbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 60px; background: var(--card);
  border-top: 1px solid var(--line);
  display: flex; z-index: 6; padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10.5px; color: var(--sub); position: relative;
}
.tab .ico { font-size: 21px; line-height: 1; filter: grayscale(1) opacity(.55); }
.tab.active { color: var(--brand); font-weight: 600; }
.tab.active .ico { filter: none; }
.tab .bubble {
  position: absolute; top: 4px; left: calc(50% + 6px);
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--brand); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* —— 通用组件 —— */
.card { background: var(--card); border-radius: var(--radius); margin: 10px 12px; padding: 14px; }
.btn-main {
  height: 40px; padding: 0 22px; border-radius: 20px;
  background: var(--brand-grad); color: #fff; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 4px 12px rgba(255, 79, 48, .35);
}
.btn-main:active { opacity: .85; }
.btn-ghost {
  height: 34px; padding: 0 14px; border-radius: 17px;
  border: 1px solid #d9dce1; color: var(--text); font-size: 13px; background: #fff;
}
.btn-buy {
  height: 44px; padding: 0 18px; border-radius: 22px;
  background: linear-gradient(135deg, #ffb03a, #ff8f1f); color: #fff; font-size: 14px; font-weight: 700;
}
.price { color: var(--price); font-weight: 700; }
.price .rmb { font-size: 12px; }
.price .num { font-size: 18px; }
.orig { color: var(--sub); font-size: 11px; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
  background: #fff1ec; color: var(--brand);
}
.tag.gray { background: #f2f3f5; color: var(--sub); }
.tag.green { background: #e8f8f2; color: var(--green); }
.tag.blue { background: #ecf2ff; color: var(--blue); }
.tag.amber { background: #fff6e5; color: #c77700; }

/* —— 登录 —— */
#view-login { padding: 40px 28px; background: linear-gradient(180deg, #fff 0%, var(--bg) 60%); }
.logo { text-align: center; margin-bottom: 6px; }
.logo .mark {
  width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px;
  background: var(--brand-grad); color: #fff; font-size: 34px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(255, 79, 48, .35);
}
.logo h1 { font-size: 22px; letter-spacing: 1px; }
.logo p { font-size: 12px; color: var(--sub); margin-top: 4px; }
.field { margin-top: 14px; }
.field label { font-size: 12.5px; color: var(--sub); display: block; margin-bottom: 6px; }
.field input {
  width: 100%; height: 46px; border: 1px solid #e5e7eb; border-radius: 12px;
  padding: 0 14px; background: #fff; font-size: 15px;
}
.field input:focus { border-color: var(--brand); }
#btnLogin { width: 100%; margin-top: 22px; height: 46px; border-radius: 23px; font-size: 16px; }
.login-note {
  margin-top: 16px; padding: 10px 12px; border-radius: 10px;
  background: #f7f8fa; border: 1px dashed #d9dce1;
  font-size: 11.5px; color: var(--sub); line-height: 1.7;
}

/* —— 首页 —— */
.searchbar {
  margin: 10px 12px 0; height: 38px; border-radius: 19px;
  background: #fff; border: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 14px; gap: 8px;
}
.searchbar .icon { color: var(--sub); }
.searchbar input { flex: 1; border: none; background: none; font-size: 13.5px; }
.banner {
  margin: 12px 12px 0; border-radius: var(--radius); overflow: hidden; position: relative;
  background: linear-gradient(120deg, #3b2f63, #7b4bc8 55%, #ff7a45);
  color: #fff; padding: 20px 18px;
}
.banner h2 { font-size: 18px; }
.banner p { font-size: 12px; opacity: .85; margin-top: 6px; }
.quick-types { display: flex; gap: 4px; margin: 12px 8px 0; overflow-x: auto; }
.qtype {
  flex: 0 0 17%; text-align: center; padding: 8px 0 6px; border-radius: 12px;
}
.qtype .qi { font-size: 24px; }
.qtype .qt { font-size: 11px; color: var(--sub); margin-top: 2px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 14px 2px; }
.sec-head h3 { font-size: 16px; }
.sec-head span { font-size: 12px; color: var(--sub); }
.act-card {
  margin: 10px 12px; background: var(--card); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.act-cover { height: 92px; position: relative; display: flex; align-items: flex-end; padding: 12px; }
.act-cover .emoji { position: absolute; right: 14px; top: 8px; font-size: 52px; opacity: .9; }
.act-cover h4 { color: #fff; font-size: 17px; text-shadow: 0 1px 4px rgba(0,0,0,.25); }
.act-cover .ip-tag {
  position: absolute; left: 12px; top: 12px;
  background: rgba(255,255,255,.22); backdrop-filter: blur(4px);
  color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px;
}
.act-body { padding: 12px 14px 14px; }
.act-meta { display: flex; gap: 8px; margin: 8px 0 10px; font-size: 11.5px; color: var(--sub); flex-wrap: wrap; }
.act-foot { display: flex; align-items: center; justify-content: space-between; }
.act-count { font-size: 12px; color: var(--sub); }
.act-count b { color: var(--brand); }

/* —— 团期详情 —— */
.act-hero { color: #fff; padding: 18px 16px 46px; position: relative; }
.act-hero h2 { font-size: 20px; }
.act-hero .sub { font-size: 12px; opacity: .9; margin-top: 6px; }
.countdown {
  position: absolute; left: 16px; right: 16px; bottom: -24px;
  background: #fff; border-radius: 12px; padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 14px rgba(0,0,0,.08); font-size: 13px;
}
.countdown b { color: var(--brand); font-variant-numeric: tabular-nums; }
.rule-card { margin-top: 38px; }
.rule-card h5, .sec-title { font-size: 14px; margin-bottom: 8px; }
.rule-card p { font-size: 12.5px; color: var(--sub); line-height: 1.8; }

/* —— 商品网格 —— */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 12px; }
.p-card { background: #fff; border-radius: 12px; overflow: hidden; }
.p-img { height: 130px; position: relative; display: flex; align-items: center; justify-content: center; font-size: 46px; }
.p-img .limit-badge {
  position: absolute; top: 8px; left: 8px;
  background: rgba(0,0,0,.45); color: #ffd60a; font-size: 10px; padding: 2px 7px; border-radius: 10px;
}
.p-info { padding: 8px 10px 10px; }
.p-name { font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 37px; }
.p-jp { font-size: 10.5px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.p-sold { font-size: 10.5px; color: var(--sub); }
.bar { height: 4px; border-radius: 2px; background: #f0f1f3; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--brand-grad); }

/* —— 商品详情 —— */
.pd-img { height: 300px; display: flex; align-items: center; justify-content: center; font-size: 100px; position: relative; }
.pd-img .dots { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; }
.pd-img .dots i { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.5); margin: 0 3px; }
.pd-img .dots i.on { background: #fff; }
.pd-head { padding: 14px 16px 4px; }
.pd-price-row { display: flex; align-items: baseline; gap: 10px; }
.pd-name { font-size: 16.5px; font-weight: 600; margin-top: 8px; line-height: 1.5; }
.pd-jp { font-size: 12px; color: var(--sub); margin-top: 4px; }
.pd-sell { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--sub); margin-top: 8px; }
.pd-block { margin: 10px 12px; background: #fff; border-radius: var(--radius); padding: 14px; }
.spec-row { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 6px 0; }
.spec-row .k { color: var(--sub); flex: 0 0 64px; font-size: 12.5px; }
.notice { font-size: 12px; color: var(--sub); line-height: 1.9; }
.notice b { color: var(--text); }
.pd-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 62px;
  background: #fff; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding: 0 14px; z-index: 6;
  padding-bottom: env(safe-area-inset-bottom);
}
.pd-bar .mini { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--sub); gap: 1px; width: 44px; }
.pd-bar .mini i { font-size: 19px; font-style: normal; }
#view-product { padding-bottom: 62px; }
.pd-bar .spacer { flex: 1; }

/* —— 购物车 —— */
.cart-group { background: #fff; border-radius: var(--radius); margin: 10px 12px; padding: 4px 14px; }
.cart-group-head { display: flex; align-items: center; gap: 8px; padding: 10px 0; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); }
.cart-item { display: flex; gap: 10px; padding: 12px 0; align-items: center; }
.ci-img { width: 74px; height: 74px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; flex: 0 0 74px; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ci-price { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }
.stepper { display: flex; align-items: center; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.stepper button { width: 26px; height: 24px; font-size: 14px; color: var(--text); background: #fafafa; }
.stepper span { width: 30px; text-align: center; font-size: 13px; }
.ci-dead { font-size: 11px; color: var(--sub); margin-top: 4px; }
.cart-item.dead { opacity: .45; }
.check {
  width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #d0d3d9;
  flex: 0 0 18px; display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 11px;
}
.check.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.cart-bar {
  position: absolute; bottom: 60px; left: 0; right: 0; height: 54px;
  background: #fff; border-top: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 14px; gap: 10px; z-index: 5;
}
.cart-bar .total { flex: 1; font-size: 13px; }
.cart-bar .total .price .num { font-size: 20px; }
.empty { text-align: center; padding: 70px 30px; color: var(--sub); }
.empty .e { font-size: 46px; margin-bottom: 12px; }
.empty p { font-size: 13px; line-height: 1.8; }

/* —— 下单确认 —— */
.addr-card { display: flex; align-items: center; gap: 10px; }
.addr-card .ai { font-size: 22px; }
.addr-card .a1 { font-size: 14px; font-weight: 600; }
.addr-card .a2 { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
.addr-card .arrow { color: var(--sub); margin-left: auto; }
.co-item { display: flex; gap: 10px; padding: 10px 0; align-items: center; }
.co-item + .co-item { border-top: 1px solid var(--line); }
.fee-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
.fee-row .v { font-variant-numeric: tabular-nums; }
.fee-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 700; font-size: 14px; }
.pay-channel { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.pay-channel + .pay-channel { border-top: 1px solid var(--line); }
.pay-channel .pi { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; }
.pay-channel .pn { flex: 1; font-size: 14px; }
.pay-channel .pn small { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
.remark-input { width: 100%; border: none; font-size: 13px; resize: none; background: none; }

/* —— 弹层 —— */
#modalRoot { position: absolute; inset: 0; z-index: 20; display: none; }
#modalRoot.open { display: block; }
.mask { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: #fff; border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 86%; overflow-y: auto;
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h4 { font-size: 16px; }
.sheet .close { color: var(--sub); font-size: 20px; padding: 4px; }

/* 支付弹层 */
.pay-amount { text-align: center; padding: 8px 0 4px; }
.pay-amount .price .num { font-size: 34px; }
.pay-amount .tail { font-size: 11.5px; color: var(--sub); margin-top: 6px; line-height: 1.7; }
.pay-amount .tail b { color: var(--brand); }
.qr-box { width: 190px; height: 190px; margin: 14px auto; border-radius: 12px; padding: 10px; background: #fff; border: 1px solid var(--line); }
.qr-box svg { width: 100%; height: 100%; display: block; }
.pay-tip { font-size: 11.5px; color: var(--sub); text-align: center; line-height: 1.8; margin-top: 4px; }
#btnPaid { width: 100%; margin-top: 14px; height: 46px; border-radius: 23px; font-size: 15px; }

/* —— 订单列表 —— */
.o-tabs { display: flex; background: #fff; padding: 0 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 4; }
.o-tab { flex: 1; text-align: center; font-size: 13.5px; color: var(--sub); padding: 11px 0; position: relative; }
.o-tab.active { color: var(--brand); font-weight: 700; }
.o-tab.active::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 20px; height: 3px; border-radius: 2px; background: var(--brand); }
.o-card { background: #fff; border-radius: var(--radius); margin: 10px 12px; padding: 12px 14px; }
.o-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
.o-status { font-weight: 700; font-size: 12.5px; }
.o-items { display: flex; gap: 8px; margin: 10px 0; }
.o-thumb { width: 58px; height: 58px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.o-more { width: 58px; height: 58px; border-radius: 8px; background: #f2f3f5; color: var(--sub); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.o-sum { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--sub); }
.o-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.o-foot .btn-ghost { height: 30px; font-size: 12px; border-radius: 15px; }
.o-foot .btn-main { height: 30px; font-size: 12px; padding: 0 14px; border-radius: 15px; }

/* —— 订单详情 / 时间线 —— */
.timeline { padding: 4px 0 4px 6px; }
.tl-node { display: flex; gap: 12px; position: relative; padding-bottom: 18px; }
.tl-node::before { content: ""; position: absolute; left: 5px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl-node:last-child::before { display: none; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: #d0d3d9; flex: 0 0 12px; margin-top: 3px; }
.tl-node.done .tl-dot { background: var(--brand); box-shadow: 0 0 0 3px #ffece7; }
.tl-body .t1 { font-size: 13px; font-weight: 600; }
.tl-body .t2 { font-size: 11.5px; color: var(--sub); margin-top: 3px; line-height: 1.6; }
.logi-node { display: flex; gap: 10px; padding: 8px 0; font-size: 12.5px; }
.logi-node .dot { width: 7px; height: 7px; border-radius: 50%; background: #d0d3d9; flex: 0 0 7px; margin-top: 5px; }
.logi-node.latest .dot { background: var(--brand); }
.logi-node .lt { color: var(--sub); font-size: 11px; margin-top: 2px; }

/* —— 我的 —— */
.me-head {
  background: var(--brand-grad); color: #fff;
  padding: 26px 18px 30px; display: flex; align-items: center; gap: 14px;
}
.avatar {
  width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  border: 2px solid rgba(255,255,255,.6);
}
.me-head .mn { font-size: 17px; font-weight: 700; }
.me-head .ms { font-size: 11.5px; opacity: .85; margin-top: 4px; }
.me-stats { display: flex; background: #fff; border-radius: var(--radius); margin: -16px 12px 0; padding: 12px 0; position: relative; }
.me-stat { flex: 1; text-align: center; }
.me-stat .n { font-size: 17px; font-weight: 700; }
.me-stat .l { font-size: 11px; color: var(--sub); margin-top: 2px; }
.me-group { background: #fff; border-radius: var(--radius); margin: 10px 12px; overflow: hidden; }
.me-row { display: flex; align-items: center; gap: 12px; padding: 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.me-row:last-child { border-bottom: none; }
.me-row .mi { font-size: 19px; }
.me-row .arrow { color: #c9cdd4; margin-left: 0; }
.me-row small { color: var(--sub); font-size: 11.5px; margin-left: auto; }
.me-row small + .arrow { margin-left: 6px; }

/* —— 表单弹层 —— */
.form-item { margin-bottom: 12px; }
.form-item label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
.form-item input, .form-item textarea {
  width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #fafafa;
}
.addr-card-pick { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
.addr-card-pick.on { border-color: var(--brand); background: #fff8f6; }
.addr-card-pick .ap1 { font-weight: 600; }
.addr-card-pick .ap2 { color: var(--sub); font-size: 12px; margin-top: 4px; }
.default-chip { font-size: 10px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

/* —— toast —— */
#toast {
  position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(10px);

// 假二维码（演示占位，非真实收款码）
function fakeQr(seedStr) {
  var seed = 0;
  for (var i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  var N = 21, cells = '';
  function finder(cx, cy) {
    for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
      var edge = x === 0 || y === 0 || x === 6 || y === 6;
      var core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      if (edge || core) cells += '<rect x="' + (cx + x) + '" y="' + (cy + y) + '" width="1" height="1"/>';
    }
  }
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (var y2 = 0; y2 < N; y2++) for (var x2 = 0; x2 < N; x2++) {
    var inFinder = (x2 < 8 && y2 < 8) || (x2 >= N - 8 && y2 < 8) || (x2 < 8 && y2 >= N - 8);
    if (!inFinder && rnd() > 0.52) cells += '<rect x="' + x2 + '" y="' + y2 + '" width="1" height="1"/>';
  }
  return '<svg viewBox="0 0 ' + N + ' ' + N + '" fill="#1f2329" shape-rendering="crispEdges">' + cells + '</svg>';
}

  }
  $('homeBody').innerHTML = html;
}

    + '<div class="p-jp">' + esc(p.jp) + '</div>'

/* ================= 购物车 ================= */

function cartQty(pid) {
  var it = state.cart.filter(function (c) { return c.pid === pid; })[0];
  return it ? it.qty : 0;
}
function addToCart(pid, qty) {
  var it = state.cart.filter(function (c) { return c.pid === pid; })[0];
  var p = prodById(pid);
  var limit = p.limit || 99;
  if (it) it.qty = Math.min(limit, it.qty + qty);
  else state.cart.push({ pid: pid, qty: Math.min(limit, qty), checked: true });
  save('sd_cart', state.cart);
  updateCartBubble();
}
function updateCartBubble() {
  var n = state.cart.reduce(function (s, c) { return s + c.qty; }, 0);
  $('cartBubble').textContent = n;
  $('cartBubble').classList.toggle('hidden', !n);
}
function cartItemDead(c) {
  var p = prodById(c.pid);
  var a = p && actById(p.actId);
  return !p || !a || a.status !== 'on';
}
function cartSelected() {
  return state.cart.filter(function (c) { return c.checked && !cartItemDead(c); });
}

function renderCart() {
  var body = $('cartBody');
  if (!state.cart.length) {
    body.innerHTML = '<div class="empty"><div class="e">🛒</div><p>购物车还是空的<br>去团期页逛逛吧</p>'
      + '<button class="btn-main" style="margin-top:14px" data-go-home>去逛团期</button></div>';
    $('cartBar').innerHTML = '';
    return;
  }
  // 按团期分组
  var groups = {};
  state.cart.forEach(function (c) {
    var p = prodById(c.pid);
    var a = p ? actById(p.actId) : null;
    var key = a ? a.id : 'unknown';
    (groups[key] = groups[key] || { act: a, items: [] }).items.push(c);
  });
  var html = Object.keys(groups).map(function (k) {
    var g = groups[k];
    return '<div class="cart-group">'
      + '<div class="cart-group-head">🛍️ ' + esc(g.act ? g.act.name : '失效商品') + '</div>'
      + g.items.map(function (c) {
        var p = prodById(c.pid);
        var dead = cartItemDead(c);
        if (dead) {
          return '<div class="cart-item dead"><div class="check on">✓</div>'
            + '<div class="ci-img" style="background:#f2f3f5">❌</div>'
            + '<div class="ci-info"><div class="ci-name">' + esc(p ? p.model : '商品已失效') + '</div>'
            + '<div class="ci-dead">该团期已截团或商品已下架，不可结算</div></div>'
            + '<button class="btn-ghost" style="height:26px;font-size:11px" data-cart-del="' + c.pid + '">删除</button></div>';
        }
        return '<div class="cart-item">'
          + '<div class="check' + (c.checked ? ' on' : '') + '" data-cart-check="' + c.pid + '">✓</div>'
          + '<div class="ci-img" style="background:linear-gradient(135deg,' + p.g[0] + '22,' + p.g[1] + '44)">' + p.emoji + '</div>'
          + '<div class="ci-info"><div class="ci-name">' + esc(p.model) + '</div>'
          + '<div class="ci-price">' + money(p.price)
          + '<span class="stepper"><button data-cart-dec="' + c.pid + '">−</button><span>' + c.qty + '</span><button data-cart-inc="' + c.pid + '">+</button></span></div>'
          + (p.limit ? '<div class="ci-dead">限购 ' + p.limit + ' 件</div>' : '')
          + '</div></div>';
      }).join('') + '</div>';
  }).join('');
  body.innerHTML = html;
  // 结算条
  var sel = cartSelected();
  var sum = 0, cnt = 0;
  sel.forEach(function (c) { sum += prodById(c.pid).price * c.qty; cnt += c.qty; });
  $('cartBar').innerHTML = sel.length
    ? '<span class="total">共 ' + cnt + ' 件，合计 ' + money(sum) + '</span>'
    + '<button class="btn-main" id="btnCheckout">去结算（' + cnt + '）</button>'
    : '<span class="total" style="color:var(--sub)">勾选商品后结算</span>';
}

/* ================= 下单确认 ================= */

var checkoutCtx = null; // { items:[{pid,qty}], from, channel, _calc }

function calcFee(act, count, goods) {
  var intl = count * 5; // 演示：¥5/件 预估
  var post = goods >= act.freeOver ? 0 : act.postFee;
  return { intl: intl, post: post };
}

function renderCheckout() {
  if (!checkoutCtx || !checkoutCtx.items.length) { back(); return; }
  var first = prodById(checkoutCtx.items[0].pid);
  var act = actById(first.actId);
  var goods = 0, count = 0;
  checkoutCtx.items.forEach(function (it) { goods += prodById(it.pid).price * it.qty; count += it.qty; });
  var fee = calcFee(act, count, goods);
  var addr = state.profile.addresses.filter(function (x) { return x.isDefault; })[0] || state.profile.addresses[0];
  checkoutCtx._calc = { goods: goods, intl: fee.intl, post: fee.post, count: count, actId: act.id };
  if (checkoutCtx.channel == null) checkoutCtx.channel = 'alipay';

  var html = '<div style="height:10px"></div>'
    + '<div class="card addr-card" id="addrPick"><span class="ai">📍</span><span>'
    + (addr
      ? '<span class="a1">' + esc(addr.name) + ' ' + maskPhone(addr.phone) + '</span>'
      + '<span class="a2">' + esc(addr.text) + '</span>'
      : '<span class="a1">请添加收货地址</span>')
    + '</span><span class="arrow">›</span></div>';
  html += '<div class="card"><div class="sec-title" style="color:var(--sub);font-size:12px">' + esc(act.name) + '</div>'
    + checkoutCtx.items.map(function (it) {
      var p = prodById(it.pid);
      return '<div class="co-item"><div class="ci-img" style="width:56px;height:56px;flex:0 0 56px;font-size:24px;'
        + 'background:linear-gradient(135deg,' + p.g[0] + '22,' + p.g[1] + '44)">' + p.emoji + '</div>'
        + '<div class="ci-info"><div class="ci-name">' + esc(p.model) + '</div>'
        + '<div class="p-jp">' + esc(p.jp) + '</div></div>'
        + '<div style="text-align:right">' + money(p.price) + '<div style="font-size:11px;color:var(--sub)">×' + it.qty + '</div></div></div>';
    }).join('') + '</div>';
  html += '<div class="card"><div class="fee-row"><span>商品总额</span><span class="v">' + money(goods) + '</span></div>'
    + '<div class="fee-row"><span>预估国际运费（¥5/件 × ' + count + '）</span><span class="v">' + money(fee.intl) + '</span></div>'
    + '<div class="fee-row"><span>国内邮费' + (fee.post === 0 ? '（已满 ¥' + act.freeOver + ' 包邮）' : '') + '</span><span class="v">' + (fee.post === 0 ? '<span class="tag green">包邮</span>' : money(fee.post)) + '</span></div>'
    + '<div class="fee-row total"><span>合计</span><span>' + money(goods + fee.intl + fee.post) + '</span></div>'
    + '<p style="font-size:11px;color:var(--sub);margin-top:8px">* 国际运费为预估，到货后按批次实重分摊，多退少补（与现有「我的国际费」口径一致）</p></div>';
  html += '<div class="card"><div class="sec-title">支付方式</div>'
    + '<div class="pay-channel"><span class="pi" style="background:#1677ff">支</span>'
    + '<span class="pn">支付宝<small>推荐：唯一尾数金额 · 到账自动核销</small></span>'
    + '<div class="check' + (checkoutCtx.channel === 'alipay' ? ' on' : '') + '" data-channel="alipay">✓</div></div>'
    + '<div class="pay-channel"><span class="pi" style="background:#07c160">微</span>'
    + '<span class="pn">微信支付<small>需个体户+备案后可跳转（V3），当前走转账核销</small></span>'
    + '<div class="check' + (checkoutCtx.channel === 'wechat' ? ' on' : '') + '" data-channel="wechat">✓</div></div></div>';
  html += '<div class="card"><div class="sec-title">订单备注</div>'
    + '<textarea class="remark-input" id="coRemark" rows="2" placeholder="选填：拼盒要求、代写贺卡等"></textarea></div>';
  html += '<div style="margin:4px 12px 20px"><button class="btn-main" style="width:100%;height:46px;border-radius:23px;font-size:16px" id="btnSubmitOrder">提交订单</button></div>';
  $('checkoutBody').innerHTML = html;
}

function submitOrder() {
  var calc = checkoutCtx._calc;
  var addr = state.profile.addresses.filter(function (x) { return x.isDefault; })[0] || state.profile.addresses[0];
  if (!addr) { toast('请先添加收货地址'); return; }
  var tail = 1 + Math.floor(Math.random() * 98); // 0.01–0.99 唯一尾数（订单指纹）
  var base = calc.goods + calc.intl + calc.post;
  var no = 'GD20260930-' + String(10000 + Math.floor(Math.random() * 89999));
  var order = {
    id: 'o' + Date.now(), no: no, status: 'unpaid', channel: checkoutCtx.channel,
    remark: ($('coRemark') && $('coRemark').value.trim()) || '',
    createdAt: '2026-09-30 ' + new Date().toTimeString().slice(0, 5),
    addr: addr, items: checkoutCtx.items.map(function (it) { return { pid: it.pid, qty: it.qty }; }),
    goods: calc.goods, intl: calc.intl, post: calc.post, total: base, paidTotal: base + tail / 100
  };
  state.orders.unshift(order);
  save('sd_orders', state.orders);
  // 从购物车移除已下单项
  if (checkoutCtx.from === 'cart') {
    state.cart = state.cart.filter(function (c) { return !c.checked || cartItemDead(c); });
    save('sd_cart', state.cart);
  }
  checkoutCtx = null;
  toast('订单已提交（演示）');
  state.currentOrder = order;
  renderOrders();
  renderOrder();
  show('order');
  openPayModal(order);
}

/* ================= 支付弹层（V1/V2/V3 三形态示意） ================= */

function openPayModal(order) {
  var chanName = order.channel === 'alipay' ? '支付宝' : '微信';
  var tailCents = Math.round((order.paidTotal - order.total) * 100);
  $('modalSheet').innerHTML =
    '<div class="sheet-head"><h4>收银台（演示）</h4><button class="close" data-modal-close>×</button></div>'
    + '<div class="pay-amount">' + money(order.paidTotal)
    + '<div class="tail">应付款 <b>¥' + fmt(order.paidTotal) + '</b>（商品 ' + fmt(order.total) + ' + 识别尾数 <b>.' + tailCents + '</b>）<br>'
    + '尾数是这笔订单的唯一指纹——按此金额转账，到账即<b>自动核销</b>，无需上传付款截图</div></div>'
    + '<div class="qr-box">' + fakeQr(order.no + order.channel) + '</div>'
    + '<div class="pay-tip">📲 长按识别 / 扫一扫 向「' + chanName + '」转账<br>'
    + '<b style="color:var(--text)">V1 现实方案：</b>固定收款码 + 唯一尾数，管理端上传账单 CSV 自动匹配核销<br>'
    + '<b style="color:var(--text)">V2 升级：</b>支付宝当面付动态码，支付回调自动核销（个人可申请）<br>'
    + '<b style="color:var(--text)">V3 升级：</b>微信/支付宝收银台直接跳起（需个体户 + 备案域名）</div>'
    + '<button class="btn-main" id="btnPaid">我已付款（模拟支付成功）</button>';
  $('modalRoot').classList.add('open');
  $('btnPaid').onclick = function () {
    order.status = 'paid';
    save('sd_orders', state.orders);
    closeModal();
    toast('支付成功（演示）：订单已自动核销');
    state.currentOrder = order;
    renderOrder();
    state.stack = ['orders']; // 支付完成后返回应回订单列表，而非过期的下单确认页
    show('order');
  };
}
function closeModal() { $('modalRoot').classList.remove('open'); }

/* ================= 订单列表 / 详情 ================= */

var ORDER_TABS = [['all', '全部'], ['unpaid', '待付款'], ['paid', '已付款'], ['shipped', '已发货'], ['done', '已完成']];

  }).join('');

  });

      var p = prodById(it.pid);
      return '<div class="o-thumb" style="background:linear-gradient(135deg,' + (p ? p.g[0] : '#eee') + '22,' + (p ? p.g[1] : '#ddd') + '44)">' + (p ? p.emoji : '❓') + '</div>';

      + o.logistics.map(function (l, i) {

    : '';
  var actions = '';

  $('orderBody').innerHTML =
    '<div class="card">' + timeline(o.status) + '</div>'
    + '<div class="card"><div class="addr-card"><span class="ai">📍</span><span>'
    + '<span class="a1">' + esc(o.addr.name) + ' ' + maskPhone(o.addr.phone) + '</span>'
    + '<span class="a2">' + esc(o.addr.text) + '</span></span></div></div>'
    + '<div class="card">' + o.items.map(function (it) {
      var p = prodById(it.pid);
      return '<div class="co-item"><div class="ci-img" style="width:52px;height:52px;flex:0 0 52px;font-size:22px;'
        + 'background:linear-gradient(135deg,' + (p ? p.g[0] : '#eee') + '22,' + (p ? p.g[1] : '#ddd') + '44)">' + (p ? p.emoji : '❓') + '</div>'
        + '<div class="ci-info"><div class="ci-name">' + esc(p ? p.model : '') + '</div>'
        + '<div class="p-jp">' + esc(p ? p.jp : '') + '</div></div>'
        + '<div style="text-align:right;font-size:12px;color:var(--sub)">×' + it.qty + '</div></div>';
    }).join('') + '<div style="border-top:1px solid var(--line);margin-top:6px"></div>' + feeRows + '</div>'
    + logi
    + '<div class="card"><div class="sec-title">ℹ️ 订单信息</div>'
    + '<p class="notice">订单号：' + esc(o.no) + '<br>下单时间：' + esc(o.createdAt) + '（演示数据）<br>'
    + (o.remark ? '备注：' + esc(o.remark) + '<br>' : '')
    + '售后：如需换囤货地/售后，联系客服转人工（对接现有工单台）</p></div>'
    + actions;
}

/* ================= 我的 ================= */

function renderProfile() {
  var p = state.profile;
  var cnt = function (s) { return state.orders.filter(function (o) { return o.status === s; }).length; };
  $('profileBody').innerHTML =
    '<div class="me-head"><div class="avatar">🦊</div><div>'
    + '<div class="mn">' + esc(p.cn) + '</div>'
    + '<div class="ms">QQ ' + esc(p.qq || '未绑定') + ' · 手机 ' + (p.phone ? maskPhone(p.phone) : '未填写') + '</div></div></div>'
    + '<div class="me-stats">'
    + '<div class="me-stat" data-otab-go="unpaid"><div class="n">' + cnt('unpaid') + '</div><div class="l">待付款</div></div>'
    + '<div class="me-stat" data-otab-go="paid"><div class="n">' + cnt('paid') + '</div><div class="l">已付款</div></div>'
    + '<div class="me-stat" data-otab-go="shipped"><div class="n">' + cnt('shipped') + '</div><div class="l">已发货</div></div>'
    + '<div class="me-stat" data-otab-go="all"><div class="n">' + state.orders.filter(function (o) { return o.status !== 'closed'; }).length + '</div><div class="l">全部订单</div></div>'
    + '</div>'
    + '<div class="me-group">'
    + '<div class="me-row" data-me="editProfile"><span class="mi">👤</span>个人资料<small>CN / QQ / 手机号</small><span class="arrow">›</span></div>'
    + '<div class="me-row" data-me="addrBook"><span class="mi">📮</span>收货地址簿<small>' + p.addresses.length + ' 条</small><span class="arrow">›</span></div>'
    + '<div class="me-row" data-me="orders"><span class="mi">📋</span>全部订单<span class="arrow">›</span></div>'
    + '</div>'
    + '<div class="me-group">'
    + '<div class="me-row" data-me="service"><span class="mi">💬</span>联系客服<small>转人工 · 对接工单台</small><span class="arrow">›</span></div>'
    + '<div class="me-row" data-me="about"><span class="mi">🧩</span>关于演示<small>F12</small><span class="arrow">›</span></div>'
    + '<div class="me-row" data-me="logout"><span class="mi">🚪</span>退出登录</div>'
    + '</div>';
}

/* ================= 弹层：资料 / 地址簿 / 关于 ================= */

function openSheet(html) {
  $('modalSheet').innerHTML = '<div class="sheet-head"><h4></h4><button class="close" data-modal-close>×</button></div>' + html;
  $('modalRoot').classList.add('open');
}

function openProfileEdit() {
  var p = state.profile;
  openSheet(
    '<div class="form-item"><label>圈名 CN（如需修改请提交改圈名申请，走现有审核流）</label><input value="' + esc(p.cn) + '" disabled style="opacity:.6"></div>'
    + '<div class="form-item"><label>QQ 号（绑定后机器人可私聊推送）</label><input id="fQq" value="' + esc(p.qq) + '" placeholder="QQ 号"></div>'
    + '<div class="form-item"><label>手机号（选填，仅用于重要订单联系；展示一律脱敏）</label><input id="fPhone" value="' + esc(p.phone) + '" placeholder="手机号"></div>'
    + '<button class="btn-main" style="width:100%" id="btnSaveProfile">保存</button>');
  $('btnSaveProfile').onclick = function () {
    p.qq = $('fQq').value.trim();
    p.phone = $('fPhone').value.trim();
    save('sd_profile', p);
    closeModal();
    toast('资料已保存（演示）');
    renderProfile();
  };
}

function openAddrBook(pickMode) {
  var p = state.profile;
  var html = p.addresses.map(function (a) {
    return '<div class="addr-card-pick' + (a.isDefault ? ' on' : '') + '" data-addr="' + a.id + '">'
      + '<div class="ap1">' + esc(a.name) + ' ' + maskPhone(a.phone)
      + (a.isDefault ? '<span class="default-chip">默认</span>' : '') + '</div>'
      + '<div class="ap2">' + esc(a.text) + '</div>'
      + '<div style="margin-top:8px;display:flex;gap:14px;font-size:12px;color:var(--blue)">'
      + (!a.isDefault && !pickMode ? '<span data-addr-default="' + a.id + '">设为默认</span>' : '')
      + '<span data-addr-del="' + a.id + '" style="color:var(--sub)">删除</span></div></div>';
  }).join('');
  html += '<div class="form-item" style="margin-top:14px"><label>新增地址</label>'
    + '<input id="naName" placeholder="收件人" style="margin-bottom:8px">'
    + '<input id="naPhone" placeholder="手机号" style="margin-bottom:8px">'
    + '<input id="naText" placeholder="省市区 街道 门牌号"></div>'
    + '<button class="btn-main" style="width:100%" id="btnAddAddr">添加地址</button>';
  openSheet(html);

  $('btnAddAddr').onclick = function () {
    var name = $('naName').value.trim(), phone = $('naPhone').value.trim(), text = $('naText').value.trim();
    if (!name || !phone || !text) { toast('请填写完整'); return; }
    p.addresses.push({ id: 'a' + Date.now(), name: name, phone: phone, text: text, isDefault: p.addresses.length === 0 });
    save('sd_profile', p);
    openAddrBook(pickMode);
    toast('地址已添加（演示）');
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-addr-default]'), function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      p.addresses.forEach(function (a) { a.isDefault = a.id === el.getAttribute('data-addr-default'); });
      save('sd_profile', p);
      openAddrBook(pickMode);
      toast('已设为默认');
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-addr-del]'), function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      var id = el.getAttribute('data-addr-del');
      p.addresses = p.addresses.filter(function (a) { return a.id !== id; });
      if (!p.addresses.some(function (a) { return a.isDefault; }) && p.addresses[0]) p.addresses[0].isDefault = true;
      save('sd_profile', p);
      openAddrBook(pickMode);
      toast('已删除');
    };
  });
  if (pickMode) {
    Array.prototype.forEach.call(document.querySelectorAll('.addr-card-pick'), function (el) {
      el.onclick = function () {
        p.addresses.forEach(function (a) { a.isDefault = a.id === el.getAttribute('data-addr'); });
        save('sd_profile', p);
        closeModal();
        renderCheckout();
        toast('已选择地址');
      };
    });
  }
}

function openAbout() {
  openSheet('<p class="notice">谷谷商城 · F12 C 端购物演示（2026-09-30）<br><br>'
    + '本页为<b>纯前端交互演示</b>：数据是写死的 mock，支付/登录均不会真实发生。<br><br>'
    + '对应计划文档 <b>docs/PLAN-F12-CEND-SHOP.md</b>：<br>'
    + '· 商品橱窗复用管理端商品主档 activityMeta[].products<br>'
    + '· 下单直落现有 orders（到货分批/国际费/发货零改造）<br>'
    + '· 支付 V1 尾数+账单核销 → V2 当面付回调 → V3 微信跳转<br>'
    + '· 登录 V1 个人 token → V3 手机号/QQ 登录<br><br>'
    + '购物车与演示订单存在 localStorage，可随时清掉重来。</p>');
}

/* ================= 事件绑定 ================= */

$('btnLogin').onclick = function () {
  var key = $('loginKey').value.trim(), id = $('loginId').value.trim();
  if (!key || !id) { toast('演示：两项任意输入即可进入'); return; }
  state.user = { key: key, cn: id };
  state.profile.cn = id;
  save('sd_user', state.user);
  save('sd_profile', state.profile);
  toast('欢迎，' + id + '（演示登录）');
  goTab('home');
};

$('btnBack').onclick = back;
$('modalMask').onclick = closeModal;
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-modal-close]')) closeModal();
});

Array.prototype.forEach.call(document.querySelectorAll('#tabbar .tab'), function (t) {
  t.onclick = function () { goTab(t.getAttribute('data-tab')); };
});

$('btnSearch').onclick = function () { renderHome($('searchInput').value); };
$('searchInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') renderHome(this.value);
});

// 首页 / 团期 / 搜索结果：卡片点击
$('homeBody').addEventListener('click', function (e) {
  var q = e.target.closest('[data-qtype]');
  if (q) { $('searchInput').value = q.getAttribute('data-qtype'); renderHome(q.getAttribute('data-qtype')); return; }
  var a = e.target.closest('[data-act]');
  if (a) { state.currentAct = actById(a.getAttribute('data-act')); renderActivity(); show('activity'); return; }
  var p = e.target.closest('[data-prod]');
  if (p) { state.currentProd = prodById(p.getAttribute('data-prod')); renderProduct(); show('product'); }
});

$('activityBody').addEventListener('click', function (e) {
  var p = e.target.closest('[data-prod]');
  if (p) { state.currentProd = prodById(p.getAttribute('data-prod')); renderProduct(); show('product'); }
});

// 商品详情底栏
$('pdBar').addEventListener('click', function (e) {
  var b = e.target.closest('[data-pd]');
  if (!b) return;
  var act = b.getAttribute('data-pd');
  var p = state.currentProd;
  if (act === 'home') { goTab('home'); return; }
  if (act === 'cart') { goTab('cart'); return; }
  if (act === 'addCart') {
    addToCart(p.id, 1);
    toast('已加入购物车');
    renderProduct();
    return;
  }
  if (act === 'buyNow') {
    checkoutCtx = { items: [{ pid: p.id, qty: 1 }], from: 'buy' };
    renderCheckout();
    show('checkout');
  }
});

// 购物车
$('cartBody').addEventListener('click', function (e) {
  if (e.target.closest('[data-go-home]')) { goTab('home'); return; }
  var chk = e.target.closest('[data-cart-check]');
  if (chk) {
    var pid = chk.getAttribute('data-cart-check');
    state.cart.forEach(function (c) { if (c.pid === pid) c.checked = !c.checked; });
    save('sd_cart', state.cart);
    renderCart();
    return;
  }
  var del = e.target.closest('[data-cart-del]');
  if (del) {
    var dp = del.getAttribute('data-cart-del');
    state.cart = state.cart.filter(function (c) { return c.pid !== dp; });
    save('sd_cart', state.cart);
    renderCart();
    return;
  }
  var inc = e.target.closest('[data-cart-inc]');
  var dec = e.target.closest('[data-cart-dec]');
  if (inc || dec) {
    var cpid = (inc || dec).getAttribute(inc ? 'data-cart-inc' : 'data-cart-dec');
    var p = prodById(cpid);
    state.cart.forEach(function (c) {
      if (c.pid !== cpid) return;
      c.qty = inc ? Math.min(p.limit || 99, c.qty + 1) : Math.max(1, c.qty - 1);
    });
    var it = state.cart.filter(function (c) { return c.pid === cpid; })[0];
    if (inc && p.limit && it && it.qty >= p.limit) toast('已达限购上限 ' + p.limit + ' 件（下单时服务端还会复核）');
    save('sd_cart', state.cart);
    renderCart();
  }
});
$('cartBar').addEventListener('click', function (e) {
  if (!e.target.closest('#btnCheckout')) return;
  var sel = cartSelected();
  if (!sel.length) { toast('请先勾选商品'); return; }
  checkoutCtx = { items: sel.map(function (c) { return { pid: c.pid, qty: c.qty }; }), from: 'cart' };
  renderCheckout();
  show('checkout');
});

// 下单确认：地址 / 支付渠道 / 提交
$('checkoutBody').addEventListener('click', function (e) {
  if (e.target.closest('#addrPick')) { openAddrBook(true); return; }
  var ch = e.target.closest('[data-channel]');
  if (ch) {
    checkoutCtx.channel = ch.getAttribute('data-channel');
    Array.prototype.forEach.call(document.querySelectorAll('[data-channel]'), function (x) {
      x.classList.toggle('on', x === ch);
    });
    return;
  }
  if (e.target.closest('#btnSubmitOrder')) submitOrder();
});

// 订单列表 / 详情
function orderAction(root) {
  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-otab]');
    if (t) { state.orderTab = t.getAttribute('data-otab'); renderOrders(); return; }
    var d = e.target.closest('[data-order-detail]');
    if (d) {
      var od = state.orders.filter(function (o) { return o.id === d.getAttribute('data-order-detail'); })[0];
      if (od) { state.currentOrder = od; renderOrder(); show('order'); }
      return;
    }
    var pay = e.target.closest('[data-order-pay]');
    if (pay) {
      var op = state.orders.filter(function (o) { return o.id === pay.getAttribute('data-order-pay'); })[0];
      if (op) openPayModal(op);
      return;
    }
    var cancel = e.target.closest('[data-order-cancel]');
    if (cancel) {
      var oc = state.orders.filter(function (o) { return o.id === cancel.getAttribute('data-order-cancel'); })[0];
      if (oc) { oc.status = 'closed'; save('sd_orders', state.orders); toast('订单已取消（演示）'); renderOrders(); }
      return;
    }
    var rcv = e.target.closest('[data-order-receive]');
    if (rcv) {
      var or = state.orders.filter(function (o) { return o.id === rcv.getAttribute('data-order-receive'); })[0];
      if (or) {
        or.status = 'done';
        save('sd_orders', state.orders);
        toast('已确认收货（演示）');
        renderOrders();
        if (state.current === 'order') { state.currentOrder = or; renderOrder(); }
      }
      return;
    }
  });
}
orderAction($('ordersBody'));
orderAction($('orderBody'));

// 订单详情底部的「去支付」（btnPayNow 无 data 属性，单独绑定入口）
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('#btnPayNow') && state.currentOrder) openPayModal(state.currentOrder);
});

$('profileBody').addEventListener('click', function (e) {
  var go = e.target.closest('[data-otab-go]');
  if (go) { state.orderTab = go.getAttribute('data-otab-go'); renderOrders(); show('orders'); return; }
  var m = e.target.closest('[data-me]');
  if (!m) return;
  var act = m.getAttribute('data-me');
  if (act === 'editProfile') openProfileEdit();
  if (act === 'addrBook') openAddrBook(false);
  if (act === 'orders') { state.orderTab = 'all'; renderOrders(); show('orders'); }
  if (act === 'service') toast('演示：转人工将对接现有 QQ 工单台（v3.21.0）');
  if (act === 'about') openAbout();
  if (act === 'logout') {
    localStorage.removeItem('sd_user');
    state.user = null;
    show('login');
  }
});

/* ================= 启动 ================= */

updateCartBubble();
if (state.user) { goTab('home'); } else { show('login'); }

})();

</script>
