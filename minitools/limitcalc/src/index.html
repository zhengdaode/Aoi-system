<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>谷圈限购计算器</title>
  <style>
    /* 关键首屏样式（少量内联；完整样式在 assets/style.css） */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Nunito', 'Noto Sans SC', -apple-system, "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #f8f8f0;
      color: #725d42;
    }
  </style>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>谷圈限购计算器</h1>
    </header>

    <noscript>
      <div class="noscript-tip">需要启用 JavaScript 才能计算，请退出后重新打开小工具。</div>
    </noscript>

    <!-- 方案设置 -->
    <section class="card">
      <h2 class="card-title">方案设置</h2>
      <div class="field">
        <label class="flabel" for="inName">方案名称（选填）</label>
        <input id="inName" type="text" class="input" maxlength="30" />
      </div>
      <div class="field-row">
        <div class="field">
          <label class="flabel" for="inFree">每单包邮线</label>
          <div class="field-inline">
            <input id="inFree" type="number" inputmode="decimal" min="0" step="0.01" class="input" placeholder="0 = 不限" />
            <select id="freeCur" class="sel sel-field">
              <option value="cny" selected>¥ 人民币</option>
              <option value="jpy">JP¥ 日元</option>
              <option value="krw">₩ 韩元</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="flabel" for="inAccounts">可用账号数</label>
          <input id="inAccounts" type="number" inputmode="numeric" min="1" step="1" class="input" placeholder="如：4" />
        </div>
        <div class="field">
          <label class="flabel" for="inMaxTypes">每账号最多几种</label>
          <input id="inMaxTypes" type="number" inputmode="numeric" min="0" step="1" class="input" placeholder="不限" />
        </div>
      </div>
    </section>

    <!-- 汇率设置（外币 → 人民币，与主系统计算器同口径） -->
    <section class="card">
      <h2 class="card-title ribbon-teal">汇率设置</h2>
      <div class="rate-row">
        <span class="rate-cur">JP¥ 日元</span>
        <label class="pnum"><span class="pnum-label">汇率</span><input id="jpyRate" type="number" inputmode="decimal" min="0" step="0.0001" class="input" value="0.048" /></label>
        <label class="pnum"><span class="pnum-label">加价</span><input id="jpyMarkup" type="number" inputmode="decimal" min="0" step="0.0001" class="input" value="0.005" /></label>
      </div>
      <div class="rate-row">
        <span class="rate-cur">₩ 韩元</span>
        <label class="pnum"><span class="pnum-label">汇率</span><input id="krwRate" type="number" inputmode="decimal" min="0" step="0.0001" class="input" value="0.0052" /></label>
        <label class="pnum"><span class="pnum-label">加价</span><input id="krwMarkup" type="number" inputmode="decimal" min="0" step="0.0001" class="input" value="0.0001" /></label>
      </div>
      <p class="tiny-tip">外币单价 ×（汇率 + 加价）折成人民币参与计算，结果 0.5 圆整。</p>
    </section>

    <!-- 商品清单 -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title ribbon-pink">商品清单</h2>
        <button id="btnAdd" type="button" class="btn-ghost btn-sm">＋ 添加商品</button>
      </div>
      <div id="productList"></div>
      <div class="row-actions">
        <button id="btnClear" type="button" class="btn-ghost btn-sm btn-danger-ghost">清空</button>
      </div>
      <p class="tiny-tip">限购留空 = 该商品单账号不限购；账号金额 = 单价 × 件数。</p>
    </section>

    <button id="btnCompute" type="button" class="btn-primary">计算购买计划</button>

    <!-- 结果 -->
    <section class="card result-card" id="resultBox" hidden>
      <h2 class="card-title ribbon-blue">购买计划结果</h2>
      <div id="resultSummary" class="r-summary"></div>
      <div id="resultCards" class="r-cards"></div>
      <div id="resultRemain" class="r-remain" hidden></div>
      <button id="btnExport" type="button" class="btn-ghost btn-export">保存结果图片到相册</button>
      <p class="tiny-tip">结果文字可长按选中复制。</p>
    </section>

    <p id="saveStatus" class="save-status" role="status"></p>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="imgPicker" type="file" accept="image/*" hidden />
  </div>

  <script defer src="./assets/core.js"></script>
  <script defer src="./assets/app.js"></script>
</body>
</html>
