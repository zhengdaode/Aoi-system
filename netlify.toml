[build]
  command = "node scripts/build-config.js"
  publish = "."

# QQ 机器人代理：浏览器只打同源 https 路径，由 Netlify 服务端转发到 ECS relay（http），
# 规避 https 页面直接 fetch http 的混合内容拦截。必须放在 SPA catch-all 之前。
[[redirects]]
  from = "/qqbot"
  to = "http://47.101.194.103:8080/"
  status = 200
  force = true

# 表格直链代理：排谷表/汇总表分享链接（static.zwlhome.com）响应无 CORS 头，
# 浏览器直接 fetch 会被跨域拦截，由 Netlify 服务端同源转发（与 /qqbot 同模式）。
# 白名单仅此主机，避免开放代理。必须放在 SPA catch-all 之前。
[[redirects]]
  from = "/media-proxy/static.zwlhome.com/*"
  to = "https://static.zwlhome.com/*"
  status = 200
  force = true

# 备用二级通道：同上，改走 ECS relay 的 /fetch（国内机中转）。当 Netlify 出海
# 访问境内源站超时/被拒时（公共代理实测 522 同因），此通道仍可达。relay 端需
# 部署含 /fetch 的 relay/relay.js 版本，未部署时本通道返回 404/405 由前端跳过。
[[redirects]]
  from = "/media-relay/static.zwlhome.com/*"
  to = "http://47.101.194.103:8080/fetch/static.zwlhome.com/*"
  status = 200
  force = true

# 图片代理（v3.9.1）：汇总表参考图内嵌 / 购买清单图片绘制需在浏览器 fetch 图片字节，
# 图床与商品图源站无 CORS 头（实测 esaimg 响应无任何 ACAO）时直连必败，经同源代理取回。
# 白名单制（每主机一组 from/to），避免开放代理。必须放在 SPA catch-all 之前。
[[redirects]]
  from = "/media-proxy/www.pokemoncenter-online.com/*"
  to = "https://www.pokemoncenter-online.com/*"
  status = 200
  force = true

[[redirects]]
  from = "/media-relay/www.pokemoncenter-online.com/*"
  to = "http://47.101.194.103:8080/fetch/www.pokemoncenter-online.com/*"
  status = 200
  force = true

[[redirects]]
  from = "/media-proxy/esaimg.cdn1.vip/*"
  to = "https://esaimg.cdn1.vip/*"
  status = 200
  force = true

[[redirects]]
  from = "/media-relay/esaimg.cdn1.vip/*"
  to = "http://47.101.194.103:8080/fetch/esaimg.cdn1.vip/*"
  status = 200
  force = true

# img.cdn1.vip：esaimg 上传后的实际存储主机（返回 URL 形如 https://img.cdn1.vip/i/*.webp）
[[redirects]]
  from = "/media-proxy/img.cdn1.vip/*"
  to = "https://img.cdn1.vip/*"
  status = 200
  force = true

[[redirects]]
  from = "/media-relay/img.cdn1.vip/*"
  to = "http://47.101.194.103:8080/fetch/img.cdn1.vip/*"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://*.supabase.co https:;
      font-src 'self';
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
    """
